name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: server (postgres ${{ matrix.postgres-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported (schema targets PostgreSQL 14+) and current major.
        include:
          - postgres-version: "14"
            postgres-image: postgres:14.19-alpine@sha256:cb54bb67c0fca8b439f18c1daadb315ad67de1faf8c387988c63080d15a54145
          - postgres-version: "18"
            postgres-image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    services:
      postgres:
        image: ${{ matrix.postgres-image }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/ai_english
      JWT_SECRET: ci-jwt-secret-0123456789abcdef0123456789abcdef
      MOCK_AI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Verify media inspector dependency
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes ffmpeg
          fi
          ffmpeg -hide_banner -version
          ffprobe -hide_banner -version
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: npm run db:setup
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/ai_english_test
      - name: End-to-end API smoke tests
        run: |
          npm start > smoke-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:4000/health > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              cat smoke-server.log
              exit 1
            fi
            sleep 1
          done
          npm run smoke
          npm run smoke:concurrent
        env:
          AI_MAX_CONCURRENCY: "10"
          ASSESS_DAILY_CAP: "100000"
          ASSESS_GLOBAL_DAILY_CAP: "100000"
          ASSESS_IP_DAILY_CAP: "100000"
          RATE_LIMIT_GLOBAL_MAX: "100000"
          RATE_LIMIT_AUTH_MAX: "100000"
          RATE_LIMIT_REGISTER_MAX: "100000"
          RATE_LIMIT_ASSESS_MAX: "100000"
          RATE_LIMIT_UPLOAD_GRANT_MAX: "100000"

  server-docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Build-only (no push): catches Dockerfile/runtime-image regressions on
      # every change instead of at release time.
      - name: Build server image
        run: docker build --file server/Dockerfile --tag ai-english-server:ci server
      - name: Exercise container liveness healthcheck command
        run: |
          docker run --rm --entrypoint node ai-english-server:ci --version

  app:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run audit:ci
      - run: npm run doctor
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Export production JavaScript bundles
        run: |
          npx expo export --platform ios --output-dir "$RUNNER_TEMP/expo-export-ios" --clear
          npx expo export --platform android --output-dir "$RUNNER_TEMP/expo-export-android" --clear
        env:
          NODE_ENV: production
          EXPO_PUBLIC_API_URL: https://api.example.invalid
